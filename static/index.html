<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minecraft Statue Generator</title>
</head>
<body style="font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 860px; margin: 28px auto; padding: 0 14px;">
  <h1 style="margin:0 0 10px;">Minecraft Statue Generator</h1>
  <p style="margin:0 0 18px; color:#333;">Upload a Java skin PNG or enter a username. Downloads a ZIP.</p>

  <form id="form" enctype="multipart/form-data" style="display:grid; gap:12px; padding:14px; border:1px solid #ddd; border-radius:12px;">
    <div>
      <div style="font-weight:600; margin-bottom:6px;">Skin</div>
      <input type="file" name="skin" accept="image/png">
      <div style="margin-top:10px;">
        <input type="text" name="username" placeholder="Minecraft username (optional)" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:10px;">
      </div>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
      <label>
        <div style="font-weight:600; margin-bottom:6px;">Pose</div>
        <select name="pose" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:10px;">
          <option value="neutral" selected>Neutral</option>
          <option value="tpose">T-Pose</option>
        </select>
      </label>

      <label>
        <div style="font-weight:600; margin-bottom:6px;">Hollow</div>
        <select name="hollow" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:10px;">
          <option value="on" selected>On (default)</option>
          <option value="off">Off</option>
        </select>
      </label>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
      <label>
        <div style="font-weight:600; margin-bottom:6px;">Block-text name label</div>
        <select name="name_label" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:10px;">
          <option value="off" selected>Off (default)</option>
          <option value="on">On</option>
        </select>
      </label>

      <label>
        <div style="font-weight:600; margin-bottom:6px;">Label Y offset</div>
        <input type="number" name="label_y" value="3" min="0" max="64" step="1"
               style="width:100%; padding:10px; border:1px solid #ccc; border-radius:10px;">
      </label>
    </div>

    <label>
      <div style="font-weight:600; margin-bottom:6px;">Label text (blank = username)</div>
      <input type="text" name="label_text" placeholder="Optional text" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:10px;">
    </label>

    <button type="submit" style="padding:12px 14px; border-radius:12px; border:0; background:#111; color:#fff; font-weight:700;">
      Generate ZIP
    </button>

    <div id="status" style="color:#333;"></div>
  </form>

  <script>
    const form = document.getElementById("form");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      status.textContent = "Generating…";

      const fd = new FormData(form);
      const res = await fetch("/api/generate", { method: "POST", body: fd });

      if (!res.ok) {
        status.textContent = "Error: " + (await res.text());
        return;
      }

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "statue.zip";
      a.click();
      URL.revokeObjectURL(url);
      status.textContent = "Done. (ZIP downloaded)";
    });
  </script>
</body>
</html>
